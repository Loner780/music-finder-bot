<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Music Finder</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--tg-theme-bg-color, #1a1a1a);
            color: var(--tg-theme-text-color, #ffffff);
            padding: 20px;
            min-height: 100vh;
        }
        h1 { font-size: 24px; margin-bottom: 20px; text-align: center; }
        .playlist {
            background: var(--tg-theme-secondary-bg-color, #2a2a2a);
            padding: 15px; margin: 10px 0; border-radius: 12px;
            cursor: pointer; transition: transform 0.2s;
        }
        .playlist:hover { transform: scale(1.02); }
        .playlist-name { font-weight: bold; font-size: 16px; margin-bottom: 5px; }
        .playlist-count { font-size: 14px; opacity: 0.7; }
        .empty { text-align: center; opacity: 0.7; margin-top: 50px; padding: 20px; }
        .error { 
            background: #ff4444; 
            color: white; 
            padding: 15px; 
            border-radius: 8px; 
            margin: 10px 0;
            font-size: 14px;
        }
        .debug {
            background: #333;
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
            font-size: 12px;
            font-family: monospace;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="empty"> Загрузка...</div>
    </div>

    <script>
        const app = document.getElementById('app');
        let userId = "7750852465";
        let API_URL = window.location.origin;

        // Инициализация Telegram WebApp
        if (window.Telegram && window.Telegram.WebApp) {
            const tg = window.Telegram.WebApp;
            tg.ready();
            tg.expand();
            
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                userId = String(tg.initDataUnsafe.user.id);
            }
        }

        // Показываем отладочную информацию
        app.innerHTML = `
            <div class="debug">
                <b>Отладка:</b><br>
                URL: ${API_URL}<br>
                User ID: ${userId}<br>
                Telegram SDK: ${window.Telegram ? '✅' : '❌'}
            </div>
            <div class="empty">⏳ Загрузка плейлистов...</div>
        `;

        async function loadPlaylists() {
            try {
                const url = `${API_URL}/api/playlists?user_id=${userId}`;
                console.log('Запрос к:', url);
                
                const response = await fetch(url);
                console.log('Статус ответа:', response.status);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const playlists = await response.json();
                console.log('Получено:', playlists);
                
                if (!playlists || Object.keys(playlists).length === 0) {
                    app.innerHTML = '<div class="empty">📭 У вас пока нет плейлистов.<br><br>Создайте их через бота командой /new</div>';
                    return;
                }
                
                let html = '<h1>📁 Мои плейлисты</h1>';
                for (const [name, tracks] of Object.entries(playlists)) {
                    html += `<div class="playlist" onclick="openPlaylist('${name}')">
                        <div class="playlist-name"> ${name}</div>
                        <div class="playlist-count">${tracks.length} тр.</div>
                    </div>`;
                }
                app.innerHTML = html;
                
            } catch (error) {
                console.error('Ошибка:', error);
                app.innerHTML = `
                    <div class="error">
                        ❌ Ошибка загрузки:<br>
                        ${error.message}
                    </div>
                    <div class="debug">
                        URL: ${API_URL}/api/playlists?user_id=${userId}
                    </div>
                `;
            }
        }

        async function openPlaylist(name) {
            try {
                const url = `${API_URL}/api/playlist?user_id=${userId}&name=${encodeURIComponent(name)}`;
                const response = await fetch(url);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const tracks = await response.json();
                
                let html = `<button class="back-btn" onclick="loadPlaylists()" style="background: var(--tg-theme-button-color, #2481cc); color: var(--tg-theme-button-text-color, #fff); border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; margin-bottom: 20px; font-size: 16px; width: 100%;">← Назад к плейлистам</button><h1>🎵 ${name}</h1>`;
                
                if (tracks.length === 0) {
                    html += '<div class="empty">Плейлист пуст</div>';
                } else {
                    tracks.forEach((track, index) => {
                        html += `<div class="track" style="background: var(--tg-theme-secondary-bg-color, #2a2a2a); padding: 12px; margin: 8px 0; border-radius: 8px; display: flex; align-items: center;">
                            <div class="track-number" style="width: 30px; font-weight: bold; opacity: 0.5;">${index + 1}.</div>
                            <div class="track-name" style="flex: 1;">${track.name}</div>
                        </div>`;
                    });
                }
                app.innerHTML = html;
                
            } catch (error) {
                console.error('Ошибка:', error);
                alert(`Ошибка загрузки плейлиста: ${error.message}`);
            }
        }

        // Запускаем загрузку
        loadPlaylists();
    </script>
</body>
</html>
